name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes no moving major tag for v8 (only exact v8.x.y), so
      # this is pinned to the exact latest; bump it when a newer release lands.
      # uv cache intentionally NOT enabled — the bundled cache saves in a
      # post-step that runs even on failed runs and can poison main; deps here
      # are small, so a clean install each run is cheaper than the risk.
      - uses: astral-sh/setup-uv@v8.3.2

      # Core + dev deps (pytest). spotDL runs as an external CLI (not needed for
      # tests) and mutagen is now a direct dependency, so a plain sync suffices.
      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          # Pin the exact local pnpm (matches the lockfile); `standalone` fetches
          # the pnpm binary directly instead of the npm self-install, which errors
          # ("Cannot use 'in' operator … 'integrity'") on some 11.x targets.
          version: 11.5.1
          standalone: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # `cache:` intentionally omitted — the bundled pnpm cache saves in a
          # post-step that runs even on a failed run and could poison main. The
          # pnpm store + Playwright browsers are restored/saved as separate,
          # success-gated steps below (see ci-cache-safety rule).

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "dir=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store
        id: cache-pnpm
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Restore Playwright browsers
        id: cache-playwright
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm -C frontend install --frozen-lockfile

      - name: Install Playwright chromium
        run: pnpm -C frontend exec playwright install --with-deps chromium

      - name: Lint
        run: pnpm -C frontend lint

      - name: Check translation catalogs and localized READMEs
        run: pnpm -C frontend i18n:check

      - name: Build (typecheck + bundle)
        run: pnpm -C frontend build

      # GitHub sets CI=true, so verify.cjs skips screenshots and just reports pass/fail.
      - name: E2E (mocked Playwright suite)
        run: pnpm -C frontend test:e2e

      - name: Save pnpm store (only on a green run)
        if: success() && steps.cache-pnpm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: ${{ steps.cache-pnpm.outputs.cache-primary-key }}

      - name: Save Playwright browsers (only on a green run)
        if: success() && steps.cache-playwright.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.cache-playwright.outputs.cache-primary-key }}

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'ahnafnafee/songmirror'
    needs: [test, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: release-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare release notes and archive the tested commit
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          tag=$(python3 .github/release_notes.py "$GITHUB_SHA" --notes "$notes" --output "$GITHUB_OUTPUT")
          filename="songmirror-${tag}.tar.gz"
          path="$RUNNER_TEMP/$filename"
          git archive --format=tar.gz --prefix="songmirror-${tag}/" --output="$path" "$GITHUB_SHA"
          printf 'path=%s\nnotes=%s\n' "$path" "$notes" >> "$GITHUB_OUTPUT"

      - name: Sign source archive provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.archive.outputs.path }}

      - name: Verify and publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.archive.outputs.tag }}
          RELEASE_TITLE: ${{ steps.archive.outputs.title }}
          RELEASE_NOTES: ${{ steps.archive.outputs.notes }}
          RELEASE_PREVIOUS_TAG: ${{ steps.archive.outputs.previous_tag }}
          RELEASE_ARCHIVE: ${{ steps.archive.outputs.path }}
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: bash .github/publish-release.sh
