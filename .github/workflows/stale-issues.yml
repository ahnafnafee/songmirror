name: Flag stale issues

on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview stale labels and comments without changing issues
        type: boolean
        default: true

permissions:
  issues: write

concurrency:
  group: stale-issues
  cancel-in-progress: false

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          debug-only: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          days-before-issue-stale: 90
          days-before-issue-close: -1
          days-before-pr-stale: -1
          days-before-pr-close: -1
          remove-issue-stale-when-updated: true
          remove-pr-stale-when-updated: false
          stale-issue-label: stale
          exempt-issue-labels: 'keep-open,security,good first issue,help wanted,in progress'
          exempt-all-issue-assignees: true
          exempt-all-issue-milestones: true
          stale-issue-message: >-
            This issue has had no activity for 90 days, so it has been marked stale.
            It remains open. If it is still relevant, a brief update will remove the
            stale label on the next check.
          operations-per-run: 50
