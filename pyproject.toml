[project]
name = "songmirror"
version = "0.1.0"
description = "One-way, authoritative-group, and N-way playlist sync across major music services"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anyascii>=0.3,<1",
    "anyio>=4.14.2,<5",
    "certifi>=2026.10.19",
    "fastapi>=0.115",
    "mutagen>=1.47",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.9",
    "rapidfuzz>=3.9,<4",
    "requests>=2.33.0,<3",
    "spotifyscraper>=3.9,<4",
    "spotipy>=2.26.0",
    "uvicorn>=0.32",
    "urllib3>=2.8.0,<3",
    "ytmusicapi>=1.12,<2",
]

[dependency-groups]
dev = [
    "httpx2>=2.5.0",
    "pytest>=9.1.1",
]

# spotDL is intentionally NOT a project dependency: it's a CLI invoked as an
# isolated external tool (see downloads._spotdl_cmd) so its tight pins never
# constrain this app's web stack. Install it separately for the local mirror:
#   uv tool install spotdl    (or: pipx install spotdl)

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]   # so tests/ can import the songmirror package
