# Set SONGMIRROR_AUTH_USERNAME and a 15+ character SONGMIRROR_AUTH_PASSWORD in
# Portainer. Set SONGMIRROR_BIND_ADDRESS to the intended host interface and
# SONGMIRROR_PUBLIC_URL to the final HTTPS address if using a reverse proxy.
services:
  songmirror:
    image: ghcr.io/ahnafnafee/songmirror:latest
    restart: unless-stopped
    ports:
      - "${SONGMIRROR_BIND_ADDRESS:-127.0.0.1}:8888:8080"
    environment:
      SONGMIRROR_AUTH_USERNAME: "${SONGMIRROR_AUTH_USERNAME:?Set an owner username}"
      SONGMIRROR_AUTH_PASSWORD: "${SONGMIRROR_AUTH_PASSWORD:?Set an owner password}"
      SONGMIRROR_PUBLIC_URL: "${SONGMIRROR_PUBLIC_URL:-}"
      SONGMIRROR_DOWNLOAD_DIR: /music
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - songmirror-data:/data
      - songmirror-music:/music
volumes:
  songmirror-data:
  songmirror-music:
